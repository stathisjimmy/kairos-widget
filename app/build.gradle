plugins {
    id 'com.android.application'
}

android {
    namespace 'gr.mytilene.kairos'
    compileSdk 34

    defaultConfig {
        applicationId "gr.mytilene.kairos"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
